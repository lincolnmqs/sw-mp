<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>

    <!-- Page Content -->
    <div class="container">

      	<div class="row">
      		<div class="col-6 mx-auto">
				<h1 class="my-4">Provas</h1>
			</div>
			<div class="col-6 mx-auto mt-4">
				<h:messages id="msg" class="alert alert-danger alerta"/>
			</div>
	 	 </div>

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Inserir Prova</h4>
					<h:form>
					
        	    	<div class="card-body">
			
						<h:outputLabel value="Nome:" for="nome" class="col-form-label"/>
						<h:inputText class="form-control" id="nome" value="#{provaController.prova.nome}"  required="true" requiredMessage="Nome Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Digite o nome da prova"/>
							<f:ajax event="blur" render="msg" />
						</h:inputText>
								
						<h:outputLabel value="Descrição:" for="descricao" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="descricao" value="#{provaController.prova.descricao}"  required="true" requiredMessage="Descrição Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Sobre, Autores, Tamanho, Classificação..."/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(provaController.prova.id == null)? 'Inserir' : 'Alterar'}" action="#{provaController.gravar}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Provas</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-sm" value="#{provaController.todasProvas}" var="prova">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{prova.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nome</f:facet>
								<h:outputText value="#{prova.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Descrição</f:facet>
								<h:outputText value="#{prova.descricao}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{provaController.remover(prova)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{provaController.carregar(prova)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
</h:body>
</html>
