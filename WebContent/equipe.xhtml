<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>
<meta charset="UTF-8" />

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>
	
	<div class="container" style="margin-top: 3%">
		<div class="row">
			<div class="col-12 mx-auto">
				<h:messages id="msg" class="alert alert-danger alerta"/>
			</div>
		</div>
	</div>

    <!-- Page Content -->
    <div class="container">

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Equipe</h4>
					<h:form>
					
        	    	<div class="card-body">
        	    	
						<div class="form-row">
						
							<div class="col-lg-6">
								<h:outputLabel value="Nome:" for="nome" class="col-form-label"/>
								<h:inputText class="form-control" id="nome" value="#{equipeController.equipe.nome}" required="true" requiredMessage="Nome Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o seu nome da Equipe"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
								
							<div class="col-lg-3">	
								<h:outputLabel value="Data Criação" for="dataCriacao" class="col-form-label"/>
								<h:inputText class="form-control" disabled="true" id="dataCriacao" value="#{equipeController.equipe.dataCriacao.time}">
									<f:convertDateTime pattern="yyyy-MM-dd" timeZone="America/Sao_Paulo" />
									<f:passThroughAttribute name="type" value="date"/>
								</h:inputText>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="Nível:" for="nivel" class="col-form-label"/>
								<h:selectOneMenu id="nivel" value="#{equipeController.equipe.nivel}" class="custom-select" required="true" requiredMessage="Nível Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItem itemLabel="Superior" itemValue="true" />
									<f:selectItem itemLabel="Técnico" itemValue="false" />
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
							
						</div>
						
						<div class="form-row">
						
							<div class="col-lg-3">
								<h:outputLabel value="Pontuação:" for="pontuacao" class="col-form-label"/>
								<h:inputText class="form-control" disabled="#{equipeController.controlador}"  id="pontuacao" value="#{equipeController.equipe.pontuacao}" required="true" requiredMessage="Pontuação Obrigatória.">
									<f:passThroughAttribute name="placeholder" value="0"/>
								</h:inputText>
							</div>
						
							<div class="col-lg-3">
								<h:outputLabel value="Participante 1:" for="participante1" class="col-form-label"/>
								<h:selectOneMenu id="participante1" value="#{equipeController.participanteId1}" class="custom-select" required="true" requiredMessage="Participante 1 Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{equipeController.todosUsuarios}" var="part1" itemLabel="#{part1.nome}" itemValue="#{part1.id}"/>
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
						
							<div class="col-lg-3">
								<h:outputLabel value="Participante 2:" for="participante2" class="col-form-label"/>
								<h:selectOneMenu id="participante2" value="#{equipeController.participanteId2}" class="custom-select" required="true" requiredMessage="Participante 2 Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{equipeController.todosUsuarios}" var="part2" itemLabel="#{part2.nome}" itemValue="#{part2.id}"/>
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="Participante 3:" for="participante3" class="col-form-label"/>
								<h:selectOneMenu id="participante3" value="#{equipeController.participanteId3}" class="custom-select" required="true" requiredMessage="Participante 3 Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{equipeController.todosUsuarios}" var="part3" itemLabel="#{part3.nome}" itemValue="#{part3.id}"/>
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
							
						</div>
						
						<div class="form-row">
						
							<div class="col-lg-6">
								<h:outputLabel value="Evento:" for="evento" class="col-form-label"/>
								<h:selectOneMenu id="evento" value="#{equipeController.eventoId}" class="custom-select" required="true" requiredMessage="Evento Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{eventoController.todosEventos}" var="even" itemLabel="#{even.nome}" itemValue="#{even.id}"/>
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
							
							<div class="col-lg-6">
								<h:outputLabel value="Colocação:" for="colocacao" class="col-form-label"/>
								<h:selectOneMenu id="colocacao" value="#{equipeController.colocacaoId}" class="custom-select">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{colocacaoController.todasColocacoes}" var="col" itemLabel="#{col.nome}" itemValue="#{col.id}"/>
								</h:selectOneMenu>
							</div>
						
						</div>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(equipeController.equipe.id == null)? 'Inserir' : 'Alterar'}" action="#{equipeController.gravar}"/>
              			<h:commandButton class="btn btn-danger"  style="margin-left: 2%" value="Limpar" action="#{equipeController.limpar}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Equipes</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-md" value="#{equipeController.todasEquipes}" var="equi">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{equi.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nome</f:facet>
								<h:outputText value="#{equi.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nível</f:facet>
								<h:outputText value="#{(equi.nivel) ? 'Superior' : 'Técnico'}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Evento</f:facet>
								<h:outputText value="#{equi.evento.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{equipeController.remover(equi)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{equipeController.carregar(equi)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
	
</h:body>
</html>
