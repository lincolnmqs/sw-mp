<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>

    <!-- Page Content -->
    <div class="container">

      	<div class="row">
      		<div class="col-6 mx-auto">
				<h1 class="my-4">Universidades</h1>
			</div>
			<div class="col-6 mx-auto mt-4">
				<h:messages id="msg" class="alert alert-danger alerta"/>
			</div>
	 	 </div>

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Inserir Universidade</h4>
					<h:form>
					
        	    	<div class="card-body">
						
						<div class="form-row">
							<div class="col-md-8">
								<h:outputLabel value="Nome:" for="nome" class="col-form-label"/>
								<h:inputText class="form-control" id="nome" value="#{universidadeController.universidade.nome}"  required="true" requiredMessage="Nome Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o nome da universidade"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-md-2">
								<h:outputLabel value="Sigla:" for="sigla" class="col-form-label"/>
								<h:inputText class="form-control" id="sigla" value="#{universidadeController.universidade.sigla}"  required="true" requiredMessage="Sigla Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite a sigla"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-md-2">
								<h:outputLabel value="Pontuação:" for="pontuacao" class="col-form-label"/>
								<h:inputText class="form-control disable" id="pontuacao" disabled="true" value="#{universidadeController.universidade.pontuacao}"/>
							</div>
							
						</div>
						
						<div class="form-row">
							<div class="col-md-6">
								<h:outputLabel value="Site:" for="site" class="col-form-label"/>
								<h:inputText class="form-control" id="site" value="#{universidadeController.universidade.site}"  required="true" requiredMessage="Site Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o site da universidade"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-md-2">
								<h:outputLabel value="Estado" for="estado" class="col-form-label"/>
								<h:selectOneMenu id="estado" value="#{universidadeController.estadoId}" class="custom-select" 
								 required="true" requiredMessage="Estado Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{universidadeController.todasEstados}" var="estado" itemLabel="#{estado.uf}" itemValue="#{estado.id}"/>
									<f:ajax event="blur" render="msg cidade" />	
								</h:selectOneMenu>
							</div>
							
							<div class="col-md-4">
								<h:outputLabel value="Cidade:" for="cidade" class="col-form-label"/>
								<h:selectOneMenu id="cidade" value="#{universidadeController.cidadeId}" class="custom-select"   required="true" requiredMessage="Cidade Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{universidadeController.todasCidades}" var="cidade" itemLabel="#{cidade.nome}" itemValue="#{cidade.id}"/>
									<f:ajax event="blur" render="msg" />	
								</h:selectOneMenu>
							</div>
						</div>
						
						<div class="form-row">
						
							<div class="col-md-6">
								<h:outputLabel value="Logo (Link da imagem na WEB):" for="logo" class="col-form-label"/>
								<h:inputText class="form-control" id="logo" value="#{universidadeController.universidade.logo}"  required="true" requiredMessage="Logo Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o link da imagem na WEB"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-md-6">
								<h:outputLabel value="Mapa (Link do IFRAME do Google Maps):" for="mapa" class="col-form-label"/>
								<h:inputText class="form-control" id="mapa" value="#{universidadeController.universidade.mapa}" required="true" requiredMessage="Link Mapa Obrigatório.">>
									<f:passThroughAttribute name="placeholder" value="Digite o link do iframe do mapa localisado pelo Google Mpas"  />
									<f:ajax event="blur" render="msg" />	
								</h:inputText>
							</div>
							
						</div>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(universidadeController.universidade.id == null)? 'Inserir' : 'Alterar'}" action="#{universidadeController.gravar}"/>
              			<h:commandButton class="btn btn-danger"  style="margin-left: 2%" value="Limpar" action="#{universidadeController.limpar}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Universidades</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-md" value="#{universidadeController.todasUniversidades}" var="uni">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{uni.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nome</f:facet>
								<h:outputText value="#{uni.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Cidade</f:facet>
								<h:outputText value="#{(uni.cidade.nome == null) ? '--' : uni.cidade.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{universidadeController.remover(uni)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{universidadeController.carregar(uni)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
</h:body>
</html>
