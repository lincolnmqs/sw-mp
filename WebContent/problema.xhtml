<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>

    <!-- Page Content -->
    <div class="container">

      	<div class="row">
      		<div class="col-6 mx-auto">
				<h1 class="my-4">Problemas</h1>
			</div>
			<div class="col-6 mx-auto mt-4">
				<h:messages id="msg" class="alert alert-danger alerta"/>
			</div>
	 	 </div>

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Inserir Problema</h4>
					<h:form>
					
        	    	<div class="card-body">
			
					<div class="form-row">
						
							<div class="col-lg-6">
								<h:outputLabel value="Nome do Problema:" for="nome" class="col-form-label"/>
								<h:inputText class="form-control" id="nome" value="#{problemaController.problema.nome}" required="true" requiredMessage="Nome Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o nome do problema"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
						
							<div class="col-lg-6">
								<h:outputLabel value="Prova" for="prova" class="col-form-label"/>
								<h:selectOneMenu id="prova" value="#{problemaController.provaId}" class="custom-select"  required="true" requiredMessage="Prova Obrigatória.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{problemaController.todasProvas}" var="prova" itemLabel="#{prova.nome}" itemValue="#{prova.id}"/>
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
						
						</div>
								
						<h:outputLabel value="Descrição Autor:" for="autorDescricao" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="autorDescricao" value="#{problemaController.problema.autorDescricao}"  required="true" requiredMessage="Descrição Autor Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Nome, idade, profissão..."/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
						
						<h:outputLabel value="Descrição do Problema:" for="descricaoProblema" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="descricaoProblema" value="#{problemaController.problema.descricao}" required="true" requiredMessage="Descrição do Problema Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Contexto do Problema."/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
						
						<h:outputLabel value="Texto Entrada do Problema:" for="entradaProblema" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="entradaProblema" value="#{problemaController.problema.entrada}"  required="true" requiredMessage="Entrada Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Entrada do Problema."/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
						
						<h:outputLabel value="Texto Saida do Problema:" for="saidaProblema" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="saidaProblema" value="#{problemaController.problema.saida}"  required="true" requiredMessage="Saída Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Saida do Problema."/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
						
						<h:outputLabel value="Código Resposta do Problema:" for="codigo" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="codigo" value="#{problemaController.problema.codigoResposta}"  required="true" requiredMessage="Código Resposta Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Código"/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(problemaController.problema.id == null)? 'Inserir' : 'Alterar'}" action="#{problemaController.gravar}"/>
              			<h:commandButton class="btn btn-danger"  style="margin-left: 2%" value="Limpar" action="#{problemaController.limpar}"/>
            		</div>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Problemas</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-md" value="#{problemaController.todosProblemas}" var="prob">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{prob.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nome</f:facet>
								<h:outputText value="#{prob.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Descrição</f:facet>
								<h:outputText value="#{prob.descricao}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Prova</f:facet>
								<h:outputText value="#{(prob.prova.nome == null) ? '--' : prob.prova.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{problemaController.remover(prob)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{problemaController.carregar(prob)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
</h:body>
</html>
