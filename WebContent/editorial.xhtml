<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>

    <!-- Page Content -->
    <div class="container">

      <div class="row">
      	<div class="col-6 mx-auto">
			<h1 class="my-4">Editorial</h1>
		</div>
		<div class="col-6 mx-auto mt-4">
			<h:messages id="msg" class="alert alert-danger alerta"/>
		</div>
	  </div>

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Inserir Editorial</h4>
					<h:form>
					
        	    	<div class="card-body">
        	    		<h:outputLabel value="Problema:" for="problema" class="col-form-label"/>
						<h:selectOneMenu id="problema" value="#{editorialController.problemaId}" class="custom-select"  required="true" requiredMessage="Problema Obrigatório.">
							<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
							<f:selectItems value="#{editorialController.todosProblemas}" var="problema" itemLabel="#{problema.nome}" itemValue="#{problema.id}"/>
							<f:ajax event="blur" render="msg" />
						</h:selectOneMenu>
						
						<h:outputLabel value="Conteúdo:" for="conteudo" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="conteudo" value="#{editorialController.editorial.conteudo}" required="true" requiredMessage="Conteúdo Obrigatório.">
							<f:passThroughAttribute name="placeholder" value="Digite um conteúdo"/>
							<f:ajax event="blur" render="msg" />
						</h:inputTextarea>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(editorialController.editorial.id == null)? 'Inserir' : 'Alterar'}" action="#{editorialController.gravar(loginController.usu)}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Editoriais</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-lg" value="#{editorialController.todosEditorial}" var="edit">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{edit.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Problema</f:facet>
								<h:outputText value="#{edit.problema.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Autor</f:facet>
								<h:outputText value="#{edit.problema.autorDescricao}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Conteúdo</f:facet>
								<h:outputText value="#{edit.conteudo}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{editorialController.remover(edit)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{editorialController.carregar(edit)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
</h:body>
</html>
