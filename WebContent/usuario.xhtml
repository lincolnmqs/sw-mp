<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>
<meta charset="UTF-8" />

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>
	
	<div class="container" style="margin-top: 4%">
		<div class="row">
			<div class="col-12 mx-auto">
				<h:messages id="msg" class="alert alert-danger alerta"/>
			</div>
		</div>
	</div>

    <!-- Page Content -->
    <div class="container">

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Alterar Usuarios</h4>
					<h:form>
					
        	    	<div class="card-body">
        	    	
						<div class="form-row">
						
							<div class="col-lg-6">
								<h:outputLabel value="Nome:" for="nome" class="col-form-label"/>
								<h:inputText class="form-control" id="nome" value="#{usuarioController.usuario.nome}" required="true" requiredMessage="Nome Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o seu nome"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
								
							<div class="col-lg-3">	
								<h:outputLabel value="CPF:" for="cpf" class="col-form-label"/>
								<h:inputText class="form-control cpf" id="cpf" value="#{usuarioController.usuario.cpf}"  required="true" requiredMessage="CPF Obrigatório.">
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="Telefone:" for="telefone" class="col-form-label"/>
								<h:inputText class="form-control telefone" id="telefone" value="#{usuarioController.usuario.ddd_telefone}" required="true" requiredMessage="Telefone Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="(xx) xxxxx-xxxx"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
						</div>
						
						<div class="form-row">
						
							<div class="col-lg-3">
								<h:outputLabel value="Senha:" for="senha" class="col-form-label"/>
								<h:inputText class="form-control" id="senha" value="#{usuarioController.usuario.senha}"  required="true" requiredMessage="Senha Obrigatória.">
									<f:passThroughAttribute name="placeholder" value="Digite a sua senha antiga ou nova senha"/>
									<f:passThroughAttribute name="type" value="password"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="Confirmar Senha:" for="confirmarSenha" class="col-form-label"/>
								<h:inputText class="form-control" id="confirmarSenha" value="#{usuarioController.confirmarSenha}"  required="true" requiredMessage="Confirmar Senha Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite a sua senha antiga ou senha novamente"/>
									<f:passThroughAttribute name="type" value="password"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="Nível de Acesso:" for="nivelAcesso" class="col-form-label"/>
								<h:selectOneMenu id="nivelAcesso" value="#{usuarioController.usuario.nivel_acesso}" class="custom-select"  required="true" requiredMessage="Nível Acesso Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItem itemLabel="Administrador" itemValue="true" />
									<f:selectItem itemLabel="Usuário Comum" itemValue="false" />
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="E-mail" for="email" class="col-form-label"/>
								<h:inputText class="form-control" id="email" value="#{usuarioController.usuario.email}"  required="true" requiredMessage="Email Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="exemplo@gmail.com"/>
									<f:passThroughAttribute name="type" value="email"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
						</div>
						
						<div class="form-row">
						
							<div class="col-lg-6">
								<h:outputLabel value="Curso/Período/Ano:" for="curso_periodo" class="col-form-label"/>
								<h:inputText class="form-control" id="curso_periodo" value="#{usuarioController.usuario.curso_periodo}"  required="true" requiredMessage="Curso/Período Obrigatório.">
									<f:passThroughAttribute name="placeholder" value="Digite o seu curso e período"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
							
							<div class="col-lg-3">
								<h:outputLabel value="Pontuação:" for="pontuacao" class="col-form-label"/>
								<h:inputText class="form-control" id="pontuacao" disabled="true" value="#{usuarioController.usuario.pontuacao}">
									<f:passThroughAttribute name="placeholder" value="0"/>
									<f:ajax event="blur" render="msg" />
								</h:inputText>
							</div>
						
							<div class="col-lg-3">
								<h:outputLabel value="Universidade" for="universidade" class="col-form-label"/>
								<h:selectOneMenu id="universidade" value="#{usuarioController.universidadeId}" class="custom-select"  required="true" requiredMessage="Universidade Obrigatório.">
									<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
									<f:selectItems value="#{usuarioController.todasUniversidades}" var="universidade" itemLabel="#{universidade.nome}" itemValue="#{universidade.id}"/>
									<f:ajax event="blur" render="msg" />
								</h:selectOneMenu>
							</div>
							
						</div>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(usuarioController.usuario.id == null)? 'Inserir' : 'Alterar'}" action="#{usuarioController.gravar}"/>
              			<h:commandButton class="btn btn-danger"  style="margin-left: 2%" value="Limpar" action="#{usuarioController.limpar}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Usuarios</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-lg" value="#{usuarioController.todosUsuarios}" var="user">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{user.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nome</f:facet>
								<h:outputText value="#{user.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Nível de Acesso</f:facet>
								<h:outputText value="#{(user.nivel_acesso) ? 'Administrador' : 'Usuário Comum'}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Universidade</f:facet>
								<h:outputText value="#{(user.universidade.nome == null) ? '--' : user.universidade.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{usuarioController.remover(user)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{usuarioController.carregar(user)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
	
</h:body>
</html>
