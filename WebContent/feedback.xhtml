<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>

    <!-- Page Content -->
    <div class="container" style="margin-top: 5%">

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Inserir Feedback</h4>
					<h:form>
					
        	    	<div class="card-body">
        	    		
		        	    <h:outputLabel value="Título" for="titulo" class="col-form-label"/>
						<h:inputText class="form-control" id="titulo" value="#{feedbackController.feedback.titulo}">
							<f:passThroughAttribute name="placeholder" value="Digite o titulo do Feedback"/>
						</h:inputText>							
			
						<h:outputLabel value="Assunto:" for="assunto" class="col-form-label"/>
						<h:selectOneMenu id="assunto" value="#{feedbackController.assuntoId}" class="custom-select">
							<f:selectItem itemLabel="Selecionar" noSelectionOption="true"/>
							<f:selectItems value="#{feedbackController.todosAssuntos}" var="assunto" itemLabel="#{assunto.nome}" itemValue="#{assunto.id}"/>
						</h:selectOneMenu>
						
						<h:outputLabel value="Descricao:" for="descricao" class="col-form-label"/>
						<h:inputTextarea class="form-control" id="descricao" value="#{feedbackController.feedback.descricao}">
							<f:passThroughAttribute name="placeholder" value="Digite uma descricao"/>
						</h:inputTextarea>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="#{(feedbackController.feedback.id == null)? 'Inserir' : 'Alterar'}" action="#{feedbackController.gravar(loginController.usu)}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Feedback</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-sm" value="#{feedbackController.carregarPeloUsu(loginController.usu)}" var="feed">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{feed.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Titulo</f:facet>
								<h:outputText value="#{feed.titulo}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Assunto</f:facet>
								<h:outputText value="#{feed.assunto.nome}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Data Criação</f:facet>
								<h:outputText value="#{feed.data_criacao.time}">
									<f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo" />
								</h:outputText>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{feedbackController.remover(feed)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Alterar" action="#{feedbackController.carregar(feed)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
</h:body>
</html>
