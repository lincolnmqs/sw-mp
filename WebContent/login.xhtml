<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>
<meta charset="UTF-8" />

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<div class="container-fluid" style="margin-top: 5%">
		<div class="row">
			<div class="col-6 mx-auto">
				<h:messages id="msg" globalOnly="true" class="alert alert-danger alerta"/>
			</div>
		</div>
	</div>

    <!-- Page Content -->
    <div class="container" style="margin-bottom: 5%">

      <!-- Marketing Icons Section -->
		<div class="row" style="margin-top: 5%">
        	<div class="col">
    	      	<div class="card h-100 text-center">
					<h4 class="card-header">Login</h4>
					<h:form>
					
        	    	<div class="card-body">
        	    	
						<div class="form-row">
							
							<div class="col-xs-hidden col-md-3 col-lg-4"></div>
								
							<div class="col-sm-12 col-md-6 col-lg-4">	
								<h:outputLabel value="CPF:" for="cpf" class="col-form-label"/>
								<h:inputText class="form-control cpf" id="cpf" value="#{loginController.usuario.cpf}">
									<f:passThroughAttribute name="placeholder" value="Digite o seu cpf"/>
								</h:inputText>
							</div>
							
						</div>
						
						<div class="form-row">
						
							<div class="col-xs-hidden col-md-3 col-lg-4"></div>
								
							<div class="col-sm-12 col-md-6 col-lg-4">
								<h:outputLabel value="Senha:" for="senha" class="col-form-label"/>
								<h:inputText class="form-control" id="senha" value="#{loginController.usuario.senha}">
									<f:passThroughAttribute name="placeholder" value="Digite a sua senha"/>
									<f:passThroughAttribute name="type" value="password"/>
								</h:inputText>
							</div>
							
						</div>
						
						<div class="form-row">
						
							<div class="col-xs-hidden col-md-3 col-lg-4"></div>
								
							<div class="col-sm-12 col-md-6 col-lg-4" style="margin-top: 2%">
								<h:commandButton class="btn btn-primary w-100" value="Logar" action="#{loginController.logar}"/>
							</div>
							
						</div>
						
            		</div>
            		
            		<div class="card-footer text-muted">
              			Maratonas de Programação
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
	
</h:body>
</html>
