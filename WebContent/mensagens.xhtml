<?xml version="1.0"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui = "http://java.sun.com/jsf/facelets">
     
<ui:include src="Conf/include/header.xhtml"/>

<h:body>

	<ui:include src="Conf/include/menu.xhtml"/>
	
	<f:metadata>
		<f:event listener="#{loginController.verificaLogado}" type="preRenderView"></f:event>
	</f:metadata>

    <!-- Page Content -->
    <div class="container" style="margin-top: 5%">

      <!-- Marketing Icons Section -->
		<div class="row">
        	<div class="col">
    	      	<div class="card h-100">
					<h4 class="card-header">Mensagem de Contato</h4>
					<h:form>
					
        	    	<div class="card-body">
        	    	
		        	    <h:outputLabel value="Título" for="titulo" class="col-form-label"/>
						<h:inputText class="form-control" id="titulo" disabled="true" value="#{contatoController.contato.titulo}"/>
			
						<div class="row">
        	    		
        	    			<div class="col-md-6">
								<h:outputLabel value="Email:" for="email" class="col-form-label"/>
								<h:inputText class="form-control" disabled="true" id="email" value="#{contatoController.contato.email}"/>
							</div>
							
							<div class="col-lg-6">	
								<h:outputLabel value="Data Criação" for="dataCriacao" class="col-form-label"/>
								<h:inputText class="form-control" disabled="true" id="dataCriacao" value="#{contatoController.contato.data_criacao.time}">
									<f:convertDateTime pattern="yyyy-MM-dd" timeZone="America/Sao_Paulo" />
									<f:passThroughAttribute name="type" value="date"/>
								</h:inputText>
							</div>
							
						</div>
						
						<h:outputLabel value="Mensagem:" for="mensagem" class="col-form-label"/>
						<h:inputTextarea class="form-control" disabled="true" id="mensagem" value="#{contatoController.contato.mensagem}"/>
						
            		</div>
            		
            		<div class="card-footer">
              			<h:commandButton class="btn btn-primary" value="Limpar" action="#{contatoController.limpar}"/>
            		</div>
            		
            		</h:form>
          		</div>
        	</div>
        </div>
        
        <div class="row" style="margin-top: 2%; margin-bottom: 1%">
        	<div class="col">
        		<h:form>
    	      	<div class="card h-100">
					<h4 class="card-header">Opções Mensagens</h4>
        	    	<div class="card-body">
            	  		<h:dataTable class="table table-striped table-hover table-responsive-lg" value="#{contatoController.todosContatos}" var="cont">
							<h:column>
								<f:facet name="header">Identificador</f:facet>
								<h:outputText value="#{cont.id}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Titulo</f:facet>
								<h:outputText value="#{cont.titulo}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Email</f:facet>
								<h:outputText value="#{cont.email}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header">Data Criação</f:facet>
								<h:outputText value="#{cont.data_criacao.time}">
									<f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo" />
								</h:outputText>
							</h:column>
							
							<h:column>
								<f:facet name="header">Ações</f:facet>
								<h:commandLink class="btn btn-danger" value="Remove" action="#{contatoController.remover(cont)}"/>
							</h:column>
							
							<h:column>
								<f:facet name="header"></f:facet>
								<h:commandLink class="btn btn-primary" value="Visualizar" action="#{contatoController.carregar(cont)}"/>
							</h:column>
						</h:dataTable>
            		</div>
          		</div>
          		</h:form>
        	</div>
        </div>
    </div>

	<ui:include src="Conf/include/footer.xhtml"/>
</h:body>
</html>
